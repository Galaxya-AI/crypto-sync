name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install ruff
        run: pip install ruff
      - name: Ruff check
        run: ruff check src tests
      - name: Ruff format check
        run: ruff format --check src tests

  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project + dev deps
        run: |
          pip install --upgrade pip
          pip install -e .[dev]
      - name: Mypy
        run: mypy src

  test:
    name: Unit + integration tests
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: crypto_test
          MARIADB_USER: crypto
          MARIADB_PASSWORD: crypto
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project + dev deps
        run: |
          pip install --upgrade pip
          pip install -e .[dev]
      - name: Run pytest with coverage
        env:
          BINANCE_API_KEY: dummy
          BINANCE_SECRET_KEY: dummy
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: crypto_test
          DB_USER: crypto
          DB_PASSWORD: crypto
        run: pytest --cov=src --cov-report=term-missing --cov-fail-under=60

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: crypto-sync:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
