[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-sync"
version = "0.1.0"
description = "Real-time Binance OHLCV ingestion API with MariaDB persistence."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.115.2",
    "uvicorn[standard]==0.32.0",
    "python-binance==1.0.19",
    "aiomysql==0.2.0",
    "pydantic==2.9.2",
    "pydantic-settings==2.6.0",
    "tenacity==9.0.0",
    "structlog==24.4.0",
    "python-dotenv==1.0.1",
    "apscheduler==3.10.4",
    "slowapi==0.1.9",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "pytest-cov==5.0.0",
    "httpx==0.27.2",
    "aioresponses==0.7.6",
    "testcontainers==4.8.2",
    "ruff==0.7.4",
    "mypy==1.13.0",
    "types-PyYAML==6.0.12.20240917",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
namespaces = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
